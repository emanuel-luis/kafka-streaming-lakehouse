# Monthly update PRs, one group per ecosystem for minor and patch: the SHA-pinned actions and
# uv.lock. Docker images are left out on purpose: their pins move with docs/PLAN.md and
# docs/DECISIONS.md. Semver-major version updates are ignored (majors move by hand) and a release
# waits 7 days before it is proposed. Security updates skip the schedule and the cooldown.
# .github/workflows/dependabot-auto-merge.yml merges these PRs once CI is green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      github-actions: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      uv: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Spark line moves by hand with the Iceberg runtime jar (iceberg-spark-runtime-<spark>_2.13
      # in src/lakestream/spark/session.py); decision 34 lists what else moves with it (decision 9).
      # Patch releases of the current line still come.
      - dependency-name: pyspark
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
