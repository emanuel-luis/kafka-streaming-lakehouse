# Iceberg catalog "lake" for Trino 484 (property names checked in the Trino 484 docs:
# object-storage/metastores.html and object-storage/file-system-s3.html).
# Keys and region come from the container environment; no secret is written here.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/warehouse
fs.s3.enabled=true
s3.endpoint=http://s3:9000
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
